[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:postgres-init]
command=/bin/bash -c "
    su - postgres -c '/usr/lib/postgresql/16/bin/pg_ctl -D /var/lib/postgresql/data -l /tmp/postgres_init.log start' &&
    sleep 5 &&
    su - postgres -c 'psql -c \"CREATE USER grist WITH PASSWORD '\'grist_simple_2024\''\"' 2>/dev/null || true &&
    su - postgres -c 'psql -c \"CREATE DATABASE grist OWNER grist\"' 2>/dev/null || true &&
    su - postgres -c 'psql -d grist -c \"CREATE EXTENSION IF NOT EXISTS postgis\"' &&
    su - postgres -c 'psql -d grist -c \"CREATE EXTENSION IF NOT EXISTS vector\"' &&
    echo '✅ Base de données initialisée' &&
    su - postgres -c '/usr/lib/postgresql/16/bin/pg_ctl -D /var/lib/postgresql/data stop' &&
    sleep 2
"
autorestart=false
priority=100
stdout_logfile=/tmp/postgres_init_out.log
stderr_logfile=/tmp/postgres_init_err.log

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autorestart=true
priority=200
stdout_logfile=/tmp/postgresql.log
stderr_logfile=/tmp/postgresql_error.log
depends_on=postgres-init

[program:grist]
command=/bin/bash -c "sleep 10 && cd /grist && node ./sandbox/supervisor.mjs"
user=grist
autorestart=true
priority=300
stdout_logfile=/tmp/grist.log
stderr_logfile=/tmp/grist_error.log
depends_on=postgresql
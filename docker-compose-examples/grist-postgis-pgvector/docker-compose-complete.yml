services:
  grist:
    image: gristlabs/grist:latest
    environment:
      # Postgres database setup
      TYPEORM_DATABASE: grist
      TYPEORM_USERNAME: grist
      TYPEORM_HOST: grist-db-complete
      TYPEORM_LOGGING: false
      TYPEORM_PASSWORD: ${DATABASE_PASSWORD}
      TYPEORM_PORT: 5432
      TYPEORM_TYPE: postgres

      # Redis setup for performance
      REDIS_URL: redis://grist-redis

      # Debugging et configuration
      DEBUG: 1
      GRIST_DEFAULT_EMAIL: admin@example.com
      GRIST_SESSION_COOKIE_AGE: 86400

    volumes:
      # Where to store persistent data, such as documents.
      - ${PERSIST_DIR}/grist:/persist
    ports:
      - "8485:8484"  # Port différent pour éviter conflicts
    depends_on:
      grist-db-complete:
        condition: service_healthy
      grist-redis:
        condition: service_started
    restart: unless-stopped

  grist-db-complete:
    build:
      context: .
      dockerfile: Dockerfile.postgis-pgvector
    environment:
        POSTGRES_DB: grist
        POSTGRES_USER: grist
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ${PERSIST_DIR}/postgres-complete:/var/lib/postgresql/data
      # Script d'initialisation complet PostGIS + pg_vector
      - ./init-complete-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grist -d grist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # Plus de temps pour le premier démarrage
    ports:
      - "5434:5432"  # Port différent
    command: >
      postgres
      -c log_statement=all
      -c shared_preload_libraries='postgis-3,vector'
      -c max_connections=200
      -c shared_buffers=256MB
    restart: unless-stopped

  grist-redis:
    image: redis:alpine
    volumes:
      - ${PERSIST_DIR}/redis:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
